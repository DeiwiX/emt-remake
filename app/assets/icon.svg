<!-- Icono de EMT remake: autobús de frente en blanco sobre el azul de la marca (#0b4fc4).
     Fuente de los PNG de assets/ (generados con @capacitor/assets). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1663e0"/>
      <stop offset="1" stop-color="#0a3fa3"/>
    </linearGradient>
  </defs>
  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>
  <g id="bus" transform="translate(512 512)">
    <!-- Carrocería -->
    <rect x="-200" y="-250" width="400" height="440" rx="70" fill="#fff"/>
    <!-- Letrero de línea -->
    <rect x="-130" y="-215" width="260" height="46" rx="14" fill="#0b4fc4"/>
    <!-- Parabrisas -->
    <rect x="-160" y="-145" width="320" height="170" rx="26" fill="#0b4fc4"/>
    <!-- Faros -->
    <circle cx="-118" cy="98" r="30" fill="#ffc94a"/>
    <circle cx="118" cy="98" r="30" fill="#ffc94a"/>
    <!-- Ruedas -->
    <rect x="-170" y="170" width="80" height="80" rx="22" fill="#fff"/>
    <rect x="90" y="170" width="80" height="80" rx="22" fill="#fff"/>
    <!-- Retrovisores -->
    <rect x="-236" y="-150" width="30" height="100" rx="14" fill="#fff"/>
    <rect x="206" y="-150" width="30" height="100" rx="14" fill="#fff"/>
  </g>
</svg>
