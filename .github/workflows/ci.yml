# Comprueba el script de datos en cada push y pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # TEMPORAL (se quita antes de unir): comprueba que GitHub llega al GTFS-RT de la EMT.
      - name: Prueba de recogida real (temporal)
        run: |
          npm run collect-delays -- --history /tmp/rt --rounds 1
          head -5 /tmp/rt/*.csv && wc -l /tmp/rt/*.csv
