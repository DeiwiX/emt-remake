# Genera cada noche los datos de la app y los publica en GitHub Pages.
# Si la descarga o la validación fallan, no se despliega nada y sigue
# publicada la versión anterior (ADR 0002).
name: Datos

on:
  schedule:
    # Cada hora: los cortes de tráfico y las incidencias cambian durante el día.
    # El resto de fuentes se actualizan hacia las 03:10 y 04:30 UTC; si no cambian,
    # dataVersion no cambia y la app no vuelve a descargar la red.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/data.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v6
      - name: Descargar el manifest publicado (para detectar caídas bruscas)
        run: curl -fsS "${{ steps.pages.outputs.base_url }}/data/v1/manifest.json" -o previous-manifest.json || echo "Sin publicación anterior"
      - name: Descargar la red peatonal publicada (se reutiliza si tiene menos de una semana)
        run: curl -fsS "${{ steps.pages.outputs.base_url }}/data/v1/walk-graph.json" -o previous-walk-graph.json || echo "Sin red peatonal anterior"
      # Si falla la descarga del GTFS del metro o de los interurbanos, se mantienen los
      # de la publicación anterior en vez de quitarlos de la app (21/10/2026; ADR 0022). Lo mismo con cada capa de
      # places.json (semáforos, desfibriladores...) si falla su fuente (ADR 0021).
      - name: Descargar los datos publicados (para mantener metro, interurbanos y capas si falla su fuente)
        run: |
          mkdir -p previous-data
          for file in network.json shapes-overview.json shapes-detail.json timetables.json places.json; do
            curl -fsS "${{ steps.pages.outputs.base_url }}/data/v1/$file" -o "previous-data/$file" || echo "Sin $file anterior"
          done
      - name: Descargar el histórico de retrasos (Fase 10)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: historico-retrasos
          path: history
      - name: Generar datos
        run: npm run build-data -- --out ../site/data/v1 --previous previous-manifest.json --previous-walk previous-walk-graph.json --delays-history ../history/data --previous-data previous-data
      - run: touch ../site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
