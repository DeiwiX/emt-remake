# Genera cada noche los datos de la app y los publica en GitHub Pages.
# Si la descarga o la validación fallan, no se despliega nada y sigue
# publicada la versión anterior (ADR 0002).
name: Datos

on:
  schedule:
    # Las fuentes se actualizan hacia las 03:10 y 04:30 UTC.
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/data.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v6
      - name: Descargar el manifest publicado (para detectar caídas bruscas)
        run: curl -fsS "${{ steps.pages.outputs.base_url }}/data/v1/manifest.json" -o previous-manifest.json || echo "Sin publicación anterior"
      - name: Generar datos
        run: npm run build-data -- --out ../site/data/v1 --previous previous-manifest.json
      - run: touch ../site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
